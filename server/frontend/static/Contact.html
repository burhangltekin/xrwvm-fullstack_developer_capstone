<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/bootstrap.min.css">

    <title>Contact Us - Best Cars</title>
</head>

<body>

<div>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light"
         style="background-color: darkturquoise; height: 1in;">

        <div class="container-fluid">

            <h2 style="padding-right: 5%;">Dealerships</h2>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarText"
                    aria-controls="navbarText"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarText">

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link"
                           style="font-size: larger;"
                           aria-current="page"
                           href="/">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           style="font-size: larger;"
                           href="/about">
                            About Us
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active"
                           style="font-size: larger;"
                           href="/contact">
                            Contact Us
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- Contact Us Section -->

    <div class="card"
         style="
            width: 80%;
            margin: auto;
            margin-top: 5%;
            padding: 30px;
         ">

        <div class="row">


            <!-- Contact Information -->

            <div class="col-md-6">

                <h1>Contact Us</h1>

                <p>
                    Have a question or need more information?
                    Feel free to contact us.
                    We're here to help and will get back to you
                    as soon as possible.
                </p>

                <hr>

                <p>
                    <strong>Email:</strong><br>
                    info@bestcars.com
                </p>

                <p>
                    <strong>Phone:</strong><br>
                    +90 555 000 00 00
                </p>

                <p>
                    <strong>Location:</strong><br>
                    Konya, Türkiye
                </p>

                <a href="mailto:info@bestcars.com"
                   style="
                       display: inline-block;
                       padding: 12px 25px;
                       background: #333;
                       color: white;
                       text-decoration: none;
                       border-radius: 5px;
                   ">
                    Contact Us
                </a>

            </div>


            <!-- Contact Us Image -->

            <div class="col-md-6"
                 style="text-align: center;">

                <img src="/static/contactus.png"
                     alt="Contact Us"
                     style="
                         width: 80%;
                         max-width: 400px;
                         margin-bottom: 20px;
                     ">

            </div>

        </div>


        <!-- Cars Image -->

        <div style="
            text-align: center;
            margin-top: 30px;
        ">

            <img src="/static/cars.jpeg"
                 alt="Best Cars dealership"
                 style="
                     width: 100%;
                     max-width: 900px;
                     height: auto;
                     border-radius: 5px;
                 ">

        </div>

    </div>

</div>

</body>

</html>
